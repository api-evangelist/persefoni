aid: persefoni
name: Persefoni
description: |
  Persefoni is a climate management and accounting platform (CMAP) used by
  enterprises and financial institutions to measure, report, and reduce
  greenhouse gas emissions. The platform serves more than 9,000 sustainability
  teams and covers Scope 1, 2, and 3 emissions, financed emissions for financial
  services (PCAF), and disclosures aligned to SBTi, TCFD, CSRD, SEC, and SASB.
  Persefoni also ships PersefoniAI and the Persefoni Copilot for in-product
  carbon accounting expertise. An Integration Hub provides pre-built connectors
  to enterprise systems (AWS, SAP Concur, Expensify, Navan, Google Sheets,
  Coupa, NetSuite, Stripe, utilities). Persefoni does not publish a fully open,
  self-service API portal; programmatic access is delivered through customer and
  partner channels.
