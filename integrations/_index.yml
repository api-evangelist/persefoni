# Persefoni integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in persefoni-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: persefoni-cloud-security-alliance-star-registry
  label: Cloud Security Alliance STAR Registry
  partner_name: Cloud Security Alliance STAR Registry
  category: Cloud security assurance
  type: register
  channel: standard-directory
  evidence: https://cloudsecurityalliance.org/star/registry/persefoni-ai-inc/services/persefoni-climate-management-accounting-platform-cmap
  source: edge
  relationship: standard-participant
  contract_reference:
    register: CSA STAR Registry (cloudsecurityalliance.org/star/registry)
    spec_file: null
    standard: CSA STAR
    role: star-level-2
    registered_name: Persefoni AI Inc.
    registry_id: persefoni-ai-inc
    service_url: https://persefoni.com/product
    matched_domain: persefoni.com
    matched_by: domain
    identity_source: the service URL the organisation filed on its STAR listing (no lookup)
    levels:
    - STAR Level 1
    - STAR Level 2
    certified_products:
    - product: STAR Certification
      lapsed: false
      latest: '2026-06-15'
    signal_note: STAR Level 1 (CAIQ self-assessment) = participation; certified_products = one entry per STAR Level
      2 / STAR for AI Level 2 assessment TYPE (third-party certification, attestation, C-STAR, ValidAIted); lapsed
      = every instance marked (Deprecated) by the registry; service counts never recorded
    detected_by: sweep-compliance-assurance.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
- slug: persefoni-cdp-accredited-solutions-provider-programme
  label: CDP (Accredited Solutions Provider programme)
  partner_name: CDP (Accredited Solutions Provider programme)
  category: CDP disclosure accredited solutions provider
  type: register
  channel: standard-directory
  evidence: https://www.cdp.net/en/partners/persefoni
  source: edge
  relationship: standard-participant
  contract_reference:
    register: CDP Accredited Solutions Providers (cdp.net/en/find-accredited-solutions-providers + partner pages)
    standard: CDP disclosure (CDP Accredited Solutions Provider programme)
    spec_file: null
    role: cdp-accredited-solutions-provider
    registered_name: Persefoni
    register_id: https://www.cdp.net/en/partners/persefoni
    partner_tier: silver
    register_statement: A silver software solutions provider in the US
    matched_domain: persefoni.com
    matched_by: domain
    matched_via: contact-email domain on the ASP page (the page links no website)
    certified_products:
    - product: CDP Accredited Solutions Provider (software)
      product_type: CDP ASP software
      lapsed: false
    signal_note: certified_products = one entry per accredited service type (software / consultancy / renewable
      energy), never per product; partner_tier is the CDP accreditation level; verification ASPs are assessors and
      are held
    detected_by: sweep-carbon-accounting-sbti-pcaf.py
    detected: '2026-10-21'
  status: not-a-workflow
  arazzo: null
